name: Build and deploy

# Walking-skeleton pipeline (Phase 2 of the build plan).
#
# build-and-push runs on GitHub's own runners (free, always available):
# builds the image, publishes it to GHCR. This is exactly what would
# happen against a real VPS later.
#
# deploy runs on a SELF-HOSTED runner instead — that's your laptop,
# standing in for the VPS during dev so there's nothing to pay for yet.
# It pulls the image build-and-push just published and runs it. Moving
# this to a real VPS later is a one-line change: point the runner (or an
# SSH step) at the VPS instead of your laptop — nothing else here changes.

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a run by hand from the Actions tab, for testing

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted # your laptop
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the image just built
        run: docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Replace the running container
        shell: bash # your laptop runs Windows; steps default to PowerShell,
        # which doesn't understand ||/line-continuations the way this script
        # needs. `shell: bash` uses Git Bash instead (already on your PATH).
        run: |
          docker stop hobbymall-skeleton 2>/dev/null || true
          docker rm hobbymall-skeleton 2>/dev/null || true
          docker run -d \
            --name hobbymall-skeleton \
            --restart unless-stopped \
            -p 8000:8000 \
            ghcr.io/${{ github.repository }}:${{ github.sha }}
